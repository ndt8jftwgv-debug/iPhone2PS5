name: Build iPhone2PS5 PTP OpenSession probe ELF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Extract project source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ZIP" || { echo "Project ZIP not found in repository root"; exit 1; }
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          test -d extracted/iPhone2PS5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 wget make unzip file binutils

      - name: Download PS5 payload SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ps5-payload-sdk"
          wget -q --show-progress \
            https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip \
            -O "$RUNNER_TEMP/ps5-payload-sdk.zip"
          unzip -q "$RUNNER_TEMP/ps5-payload-sdk.zip" -d "$RUNNER_TEMP/ps5-payload-sdk"
          SDK_MK="$(find "$RUNNER_TEMP/ps5-payload-sdk" -type f -path '*/toolchain/prospero.mk' -print -quit)"
          test -n "$SDK_MK" || { echo "SDK toolchain/prospero.mk was not found"; exit 1; }
          SDK_DIR="${SDK_MK%/toolchain/prospero.mk}"
          echo "PS5_PAYLOAD_SDK=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Prepare read-only PTP handshake probe
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/extracted/iPhone2PS5"
          mkdir -p "$ROOT/bin"

          cat > "$ROOT/src/payload.c" <<'C'
          #include <sys/types.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <poll.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          #include <unistd.h>

          typedef struct notify_request {
              char useless1[45];
              char message[3075];
          } notify_request_t;
          int sceKernelSendNotificationRequest(int, notify_request_t *, size_t, int);

          static void notify(const char *message) {
              notify_request_t request;
              memset(&request, 0, sizeof(request));
              snprintf(request.message, sizeof(request.message), "%s", message);
              sceKernelSendNotificationRequest(0, &request, sizeof(request), 0);
          }
          static uint32_t le32(const unsigned char *p) {
              return (uint32_t)p[0] | ((uint32_t)p[1] << 8) |
                     ((uint32_t)p[2] << 16) | ((uint32_t)p[3] << 24);
          }
          static uint16_t le16(const unsigned char *p) {
              return (uint16_t)p[0] | ((uint16_t)p[1] << 8);
          }
          static int read_container(int fd, unsigned char *buf, size_t cap, int timeout_ms) {
              struct pollfd pfd = { .fd = fd, .events = POLLIN, .revents = 0 };
              int ready = poll(&pfd, 1, timeout_ms);
              if (ready <= 0) return ready;
              return (int)read(fd, buf, cap);
          }

          int main(void) {
              int outfd = open("/dev/usb/1.2.2", O_WRONLY);
              int infd = open("/dev/usb/1.2.1", O_RDONLY);
              char msg[3075];
              if (outfd < 0 || infd < 0) {
                  snprintf(msg, sizeof(msg),
                           "iPhone2PS5 PTP OpenSession: open failed OUT=%d e=%d IN=%d e=%d",
                           outfd, (outfd < 0 ? errno : 0),
                           infd, (infd < 0 ? errno : 0));
                  notify(msg);
                  if (outfd >= 0) close(outfd);
                  if (infd >= 0) close(infd);
                  return 0;
              }

              /* PTP OpenSession: 12-byte header + one 32-bit SessionID parameter. */
              const unsigned char open_session[16] = {
                  0x10,0x00,0x00,0x00, 0x01,0x00, 0x02,0x10,
                  0x00,0x00,0x00,0x00, 0x01,0x00,0x00,0x00
              };
              errno = 0;
              ssize_t sent = write(outfd, open_session, sizeof(open_session));
              int we = (sent < 0) ? errno : 0;
              if (sent != (ssize_t)sizeof(open_session)) {
                  snprintf(msg, sizeof(msg),
                           "iPhone2PS5 PTP OpenSession: write=%ld errno=%d",
                           (long)sent, we);
                  notify(msg);
                  close(outfd); close(infd);
                  return 0;
              }

              unsigned char response[512] = {0};
              int got = read_container(infd, response, sizeof(response), 5000);
              if (got < 12) {
                  snprintf(msg, sizeof(msg),
                           "iPhone2PS5 PTP OpenSession: sent=16 read=%d errno=%d",
                           got, (got < 0 ? errno : 0));
                  notify(msg);
                  close(outfd); close(infd);
                  return 0;
              }

              uint32_t declared = le32(response);
              uint16_t type = le16(response + 4);
              uint16_t code = le16(response + 6);
              uint32_t tx = le32(response + 8);
              snprintf(msg, sizeof(msg),
                       "iPhone2PS5 PTP OpenSession: sent=16 read=%d len=%u type=0x%04x code=0x%04x tx=%u",
                       got, declared, type, code, tx);
              close(outfd);
              close(infd);
              notify(msg);
              return 0;
          }
          C
          C

          cat > "$ROOT/Makefile" <<'MAKE'
          PS5_HOST ?= ps5
          PS5_PORT ?= 9021
          ifndef PS5_PAYLOAD_SDK
          $(error PS5_PAYLOAD_SDK is undefined)
          endif
          include $(PS5_PAYLOAD_SDK)/toolchain/prospero.mk
          ELF := bin/iPhone2PS5.elf
          CFLAGS := -Wall -O2
          all: $(ELF)
          $(ELF): src/payload.c
          	$(CC) $(CFLAGS) -o $@ $^
          clean:
          	rm -f $(ELF)
          .PHONY: all clean
          MAKE

      - name: Build ELF
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/extracted/iPhone2PS5"
          make -C "$ROOT" PS5_PAYLOAD_SDK="$PS5_PAYLOAD_SDK"
          ELF="$ROOT/bin/iPhone2PS5.elf"
          test -s "$ELF"
          file "$ELF"
          readelf -h "$ELF"

      - name: Upload PTP handshake probe ELF
        uses: actions/upload-artifact@v4
        with:
          name: iPhone2PS5-PTP-OpenSession-probe-ELF
          path: extracted/iPhone2PS5/bin/iPhone2PS5.elf
          if-no-files-found: error
          retention-days: 14
