name: Build iPhone2PS5 USB config probe ELF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Extract project source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ZIP" || { echo "Project ZIP not found in repository root"; exit 1; }
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          test -d extracted/iPhone2PS5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 wget make unzip file binutils

      - name: Download PS5 payload SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ps5-payload-sdk"
          wget -q --show-progress \
            https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip \
            -O "$RUNNER_TEMP/ps5-payload-sdk.zip"
          unzip -q "$RUNNER_TEMP/ps5-payload-sdk.zip" -d "$RUNNER_TEMP/ps5-payload-sdk"
          SDK_MK="$(find "$RUNNER_TEMP/ps5-payload-sdk" -type f -path '*/toolchain/prospero.mk' -print -quit)"
          test -n "$SDK_MK" || { echo "SDK toolchain/prospero.mk was not found"; exit 1; }
          SDK_DIR="${SDK_MK%/toolchain/prospero.mk}"
          echo "PS5_PAYLOAD_SDK=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Prepare read-only USB configuration probe
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/extracted/iPhone2PS5"
          mkdir -p "$ROOT/bin"

          cat > "$ROOT/src/payload.c" <<'C'
          #include <sys/types.h>
          #include <sys/ioctl.h>
          #include <dev/usb/usb_ioctl.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          #include <unistd.h>

          typedef struct notify_request {
              char useless1[45];
              char message[3075];
          } notify_request_t;
          int sceKernelSendNotificationRequest(int, notify_request_t *, size_t, int);

          static void notify(const char *message) {
              notify_request_t request;
              memset(&request, 0, sizeof(request));
              snprintf(request.message, sizeof(request.message), "%s", message);
              sceKernelSendNotificationRequest(0, &request, sizeof(request), 0);
          }

          int main(void) {
              const char *node = "/dev/ugen1.2";
              int fd = open(node, O_RDONLY | O_NONBLOCK);
              int open_error = (fd < 0) ? errno : 0;
              int config = -999;
              int config_rc = -999, config_error = 0;
              struct usb_alt_interface alt;
              memset(&alt, 0, sizeof(alt));
              alt.uai_interface_index = 0;
              int alt_rc = -999, alt_error = 0;

              if (fd >= 0) {
                  errno = 0;
                  config_rc = ioctl(fd, USB_GET_CONFIG, &config);
                  config_error = (config_rc < 0) ? errno : 0;

                  errno = 0;
                  alt_rc = ioctl(fd, USB_GET_ALTINTERFACE, &alt);
                  alt_error = (alt_rc < 0) ? errno : 0;
              }

              char msg[3075];
              snprintf(msg, sizeof(msg),
                       "iPhone2PS5 USB config probe: node=%s fd=%d openerr=%d GET_CONFIG rc=%d err=%d value=%d GET_ALT rc=%d err=%d iface=%u alt=%u",
                       node, fd, open_error,
                       config_rc, config_error, config,
                       alt_rc, alt_error,
                       (unsigned)alt.uai_interface_index,
                       (unsigned)alt.uai_alt_index);
              if (fd >= 0) close(fd);
              notify(msg);
              return 0;
          }
          C

          cat > "$ROOT/Makefile" <<'MAKE'
          PS5_HOST ?= ps5
          PS5_PORT ?= 9021
          ifndef PS5_PAYLOAD_SDK
          $(error PS5_PAYLOAD_SDK is undefined)
          endif
          include $(PS5_PAYLOAD_SDK)/toolchain/prospero.mk
          ELF := bin/iPhone2PS5.elf
          CFLAGS := -Wall -O2
          all: $(ELF)
          $(ELF): src/payload.c
          	$(CC) $(CFLAGS) -o $@ $^
          clean:
          	rm -f $(ELF)
          .PHONY: all clean
          MAKE

      - name: Build ELF
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/extracted/iPhone2PS5"
          make -C "$ROOT" PS5_PAYLOAD_SDK="$PS5_PAYLOAD_SDK"
          ELF="$ROOT/bin/iPhone2PS5.elf"
          test -s "$ELF"
          file "$ELF"
          readelf -h "$ELF"

      - name: Upload USB config probe ELF
        uses: actions/upload-artifact@v4
        with:
          name: iPhone2PS5-USB-config-probe-ELF
          path: extracted/iPhone2PS5/bin/iPhone2PS5.elf
          if-no-files-found: error
          retention-days: 14
