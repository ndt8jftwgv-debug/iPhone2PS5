name: Build iPhone2PS5 USB interface probe ELF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Extract project source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ZIP" || { echo "Project ZIP not found in repository root"; exit 1; }
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          test -d extracted/iPhone2PS5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 wget make unzip file binutils

      - name: Download elfldr-compatible PS5 payload SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ps5-payload-sdk"
          wget -q --show-progress \
            https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip \
            -O "$RUNNER_TEMP/ps5-payload-sdk.zip"
          unzip -q "$RUNNER_TEMP/ps5-payload-sdk.zip" -d "$RUNNER_TEMP/ps5-payload-sdk"
          SDK_MK="$(find "$RUNNER_TEMP/ps5-payload-sdk" -type f -path '*/toolchain/prospero.mk' -print -quit)"
          test -n "$SDK_MK" || { echo "SDK toolchain/prospero.mk was not found"; exit 1; }
          SDK_DIR="${SDK_MK%/toolchain/prospero.mk}"
          echo "PS5_PAYLOAD_SDK=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Prepare read-only USB interface descriptor probe
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/extracted/iPhone2PS5"
          mkdir -p "$ROOT/bin"

          cat > "$ROOT/src/payload.c" <<'C'
          #include <sys/types.h>
          #include <sys/ioctl.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          #include <unistd.h>
          #include <dev/usb/usb.h>
          #include <dev/usb/usb_ioctl.h>

          typedef struct notify_request {
              char useless1[45];
              char message[3075];
          } notify_request_t;
          int sceKernelSendNotificationRequest(int, notify_request_t *, size_t, int);

          static void notify(const char *message) {
              notify_request_t request;
              memset(&request, 0, sizeof(request));
              snprintf(request.message, sizeof(request.message), "%s", message);
              sceKernelSendNotificationRequest(0, &request, sizeof(request), 0);
          }

          int main(void) {
              char summary[2400] = {0};
              size_t used = 0;
              int nodes = 0, detected = 0, apple = 0, full_ok = 0, full_fail = 0;
              int total_ifaces = 0, total_eps = 0;

              for (int bus = 0; bus < 8; ++bus) {
                  for (int addr = 1; addr < 16; ++addr) {
                      char path[32];
                      snprintf(path, sizeof(path), "/dev/ugen%d.%d", bus, addr);
                      if (access(path, F_OK) != 0) continue;
                      ++nodes;
                      int fd = open(path, O_RDONLY);
                      if (fd < 0) continue;

                      struct usb_device_descriptor dd;
                      memset(&dd, 0, sizeof(dd));
                      if (ioctl(fd, USB_GET_DEVICE_DESC, &dd) != 0) {
                          close(fd);
                          continue;
                      }

                      ++detected;
                      unsigned int vid = UGETW(dd.idVendor);
                      unsigned int pid = UGETW(dd.idProduct);
                      if (vid != 0x05ac) {
                          close(fd);
                          continue;
                      }
                      ++apple;

                      unsigned char raw[8192];
                      memset(raw, 0, sizeof(raw));
                      struct usb_gen_descriptor gd;
                      memset(&gd, 0, sizeof(gd));
                      gd.ugd_data = raw;
                      gd.ugd_maxlen = (uint16_t)sizeof(raw);
                      gd.ugd_config_index = 0;

                      if (ioctl(fd, USB_GET_FULL_DESC, &gd) != 0 || gd.ugd_actlen < 9) {
                          ++full_fail;
                          char item[128];
                          snprintf(item, sizeof(item), "%s Apple %04x:%04x full-desc-error=%d",
                                   path, vid, pid, errno);
                          size_t n = strlen(item);
                          if (used + n + 3 < sizeof(summary)) {
                              if (used) { memcpy(summary + used, "; ", 2); used += 2; }
                              memcpy(summary + used, item, n + 1);
                              used += n;
                          }
                          close(fd);
                          continue;
                      }

                      ++full_ok;
                      int ifaces = 0, eps = 0;
                      char iface_text[640] = {0};
                      size_t iu = 0;
                      uint16_t actual = gd.ugd_actlen;
                      for (uint16_t off = 0; off + 2 <= actual; ) {
                          uint8_t len = raw[off];
                          uint8_t type = raw[off + 1];
                          if (len < 2 || off + len > actual) break;
                          if (type == 4 && len >= 9) {
                              ++ifaces;
                              char one[64];
                              snprintf(one, sizeof(one), " I%u=%02x/%02x/%02x",
                                       (unsigned int)raw[off + 2],
                                       (unsigned int)raw[off + 5],
                                       (unsigned int)raw[off + 6],
                                       (unsigned int)raw[off + 7]);
                              size_t n = strlen(one);
                              if (iu + n + 1 < sizeof(iface_text)) {
                                  memcpy(iface_text + iu, one, n + 1);
                                  iu += n;
                              }
                          } else if (type == 5 && len >= 7) {
                              ++eps;
                          }
                          off = (uint16_t)(off + len);
                      }
                      total_ifaces += ifaces;
                      total_eps += eps;

                      char item[800];
                      snprintf(item, sizeof(item), "%s Apple %04x:%04x cfg-bytes=%u interfaces=%d endpoints=%d%s",
                               path, vid, pid, (unsigned int)actual, ifaces, eps, iface_text);
                      size_t n = strlen(item);
                      if (used + n + 3 < sizeof(summary)) {
                          if (used) { memcpy(summary + used, "; ", 2); used += 2; }
                          memcpy(summary + used, item, n + 1);
                          used += n;
                      }
                      close(fd);
                  }
              }

              char message[3075];
              snprintf(message, sizeof(message),
                       "iPhone2PS5 USB IF probe: nodes=%d devices=%d Apple=%d desc-ok=%d desc-fail=%d interfaces=%d endpoints=%d. %s",
                       nodes, detected, apple, full_ok, full_fail,
                       total_ifaces, total_eps, summary[0] ? summary : "No Apple interface details.");
              notify(message);
              return 0;
          }
          C

          cat > "$ROOT/Makefile" <<'MAKE'
          PS5_HOST ?= ps5
          PS5_PORT ?= 9021
          ifndef PS5_PAYLOAD_SDK
          $(error PS5_PAYLOAD_SDK is undefined)
          endif
          include $(PS5_PAYLOAD_SDK)/toolchain/prospero.mk
          ELF := bin/iPhone2PS5.elf
          CFLAGS := -Wall -Werror -O2
          all: $(ELF)
          $(ELF): src/payload.c
          	$(CC) $(CFLAGS) -o $@ $^
          clean:
          	rm -f $(ELF)
          .PHONY: all clean
          MAKE

      - name: Build ELF with the official payload SDK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/extracted/iPhone2PS5"
          make -C "$ROOT" PS5_PAYLOAD_SDK="$PS5_PAYLOAD_SDK"
          ELF="$ROOT/bin/iPhone2PS5.elf"
          test -s "$ELF"
          file "$ELF"
          readelf -h "$ELF"
          readelf -Ws "$ELF" | grep -E 'main|sceKernelSendNotificationRequest' || true

      - name: Upload USB interface probe ELF
        uses: actions/upload-artifact@v4
        with:
          name: iPhone2PS5-USB-interface-probe-ELF
          path: extracted/iPhone2PS5/bin/iPhone2PS5.elf
          if-no-files-found: error
          retention-days: 14
