name: Build iPhone2PS5 full USB configuration diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          test -d extracted/iPhone2PS5
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 wget make unzip file binutils
      - name: Download PS5 SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk"
          wget -q https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip -O "$RUNNER_TEMP/sdk.zip"
          unzip -q "$RUNNER_TEMP/sdk.zip" -d "$RUNNER_TEMP/sdk"
          MK="$(find "$RUNNER_TEMP/sdk" -type f -path '*/toolchain/prospero.mk' -print -quit)"
          test -n "$MK"
          echo "PS5_PAYLOAD_SDK=${MK%/toolchain/prospero.mk}" >> "$GITHUB_ENV"
      - name: Create read-only descriptor parser
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/extracted/iPhone2PS5"
          mkdir -p "$ROOT/bin"
          cat > "$ROOT/src/payload.c" <<'C'
          #include <sys/types.h>
          #include <sys/ioctl.h>
          #include <dev/usb/usb_ioctl.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          #include <unistd.h>

          typedef struct notify_request {
              char useless1[45];
              char message[3075];
          } notify_request_t;
          int sceKernelSendNotificationRequest(int, notify_request_t *, size_t, int);

          static void notify(const char *s) {
              notify_request_t n;
              memset(&n, 0, sizeof(n));
              snprintf(n.message, sizeof(n.message), "%s", s);
              sceKernelSendNotificationRequest(0, &n, sizeof(n), 0);
          }

          int main(void) {
              int fd = open("/dev/ugen1.2", O_RDONLY | O_NONBLOCK);
              if (fd < 0) {
                  char m[3075];
                  snprintf(m, sizeof(m), "USB full descriptor: open failed errno=%d", errno);
                  notify(m);
                  return 0;
              }

              char report[3075];
              size_t used = 0;
              int configs_ok = 0;
              int ptp_count = 0;
              int total_interfaces = 0;

              for (int index = 0; index < 4; index++) {
                  unsigned char raw[2048];
                  memset(raw, 0, sizeof(raw));
                  struct usb_full_desc full;
                  memset(&full, 0, sizeof(full));
                  full.ufd_config_index = index;
                  full.ufd_size = sizeof(raw);
                  full.ufd_data = raw;

                  errno = 0;
                  int rc = ioctl(fd, USB_GET_FULL_DESC, &full);
                  int err = rc < 0 ? errno : 0;

                  if (rc < 0) {
                      int n = snprintf(report + used, sizeof(report) - used,
                          "cfgIdx%d rc=%d e=%d; ", index, rc, err);
                      if (n > 0 && (size_t)n < sizeof(report) - used) used += (size_t)n;
                      continue;
                  }

                  configs_ok++;
                  size_t limit = full.ufd_size;
                  if (limit > sizeof(raw)) limit = sizeof(raw);
                  int cfg_value = -1, interfaces = -1;
                  int in_cfg_ptp = 0;
                  int ep_count = 0;

                  for (size_t off = 0; off + 2 <= limit; ) {
                      unsigned len = raw[off];
                      unsigned type = raw[off + 1];
                      if (len < 2 || off + len > limit) break;

                      if (type == 2 && len >= 9) {
                          cfg_value = raw[off + 5];
                          interfaces = raw[off + 4];
                      } else if (type == 4 && len >= 9) {
                          unsigned cls = raw[off + 5];
                          unsigned sub = raw[off + 6];
                          unsigned proto = raw[off + 7];
                          if (cls == 6 && sub == 1 && proto == 1) {
                              ptp_count++;
                              in_cfg_ptp = 1;
                          } else {
                              in_cfg_ptp = 0;
                          }
                          total_interfaces++;
                      } else if (type == 5 && len >= 7) {
                          ep_count++;
                      }
                      off += len;
                  }

                  int n = snprintf(report + used, sizeof(report) - used,
                      "cfgIdx%d val=%d ifaces=%d PTP=%d endpoints=%d bytes=%u; ",
                      index, cfg_value, interfaces, in_cfg_ptp, ep_count,
                      (unsigned)limit);
                  if (n > 0 && (size_t)n < sizeof(report) - used) used += (size_t)n;
              }

              if (used == 0) snprintf(report, sizeof(report), "No configuration descriptors returned");
              else {
                  size_t left = sizeof(report) - used;
                  snprintf(report + used, left,
                      "RESULT configsOK=%d ptpInterfaces=%d interfacesSeen=%d",
                      configs_ok, ptp_count, total_interfaces);
              }
              close(fd);
              notify(report);
              return 0;
          }
          C
          cat > "$ROOT/Makefile" <<'MAKE'
          ifndef PS5_PAYLOAD_SDK
          $(error PS5_PAYLOAD_SDK is undefined)
          endif
          include $(PS5_PAYLOAD_SDK)/toolchain/prospero.mk
          ELF := bin/iPhone2PS5.elf
          all: $(ELF)
          $(ELF): src/payload.c
          	$(CC) -Wall -O2 -o $@ $^
          .PHONY: all
          MAKE
          sed -i 's/\\t/	/g' "$ROOT/Makefile"
      - name: Build ELF
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/extracted/iPhone2PS5"
          make -C "$ROOT" PS5_PAYLOAD_SDK="$PS5_PAYLOAD_SDK"
          test -s "$ROOT/bin/iPhone2PS5.elf"
          file "$ROOT/bin/iPhone2PS5.elf"
      - uses: actions/upload-artifact@v4
        with:
          name: iPhone2PS5-USB-full-descriptor-diagnostic
          path: extracted/iPhone2PS5/bin/iPhone2PS5.elf
          if-no-files-found: error
          retention-days: 14
