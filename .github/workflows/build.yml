
name: Inspect iPhone2PS5 source

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract and print source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ZIP"
          mkdir extracted
          unzip -q "$ZIP" -d extracted

          ROOT="extracted/iPhone2PS5"

          echo "===== CMAKE FILE ====="
          cat "$ROOT/CMakeLists.txt"

          echo "===== PAYLOAD SOURCE ====="
          cat "$ROOT/src/payload.c"

          echo "===== TECHNICAL STATUS ====="
          cat "$ROOT/docs/TECHNICAL_STATUS_AR.md"
