name: Build iPhone2PS5 PTP handshake probe ELF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Extract project source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ZIP" || { echo "Project ZIP not found in repository root"; exit 1; }
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          test -d extracted/iPhone2PS5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 wget make unzip file binutils

      - name: Download PS5 payload SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ps5-payload-sdk"
          wget -q --show-progress \
            https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip \
            -O "$RUNNER_TEMP/ps5-payload-sdk.zip"
          unzip -q "$RUNNER_TEMP/ps5-payload-sdk.zip" -d "$RUNNER_TEMP/ps5-payload-sdk"
          SDK_MK="$(find "$RUNNER_TEMP/ps5-payload-sdk" -type f -path '*/toolchain/prospero.mk' -print -quit)"
          test -n "$SDK_MK" || { echo "SDK toolchain/prospero.mk was not found"; exit 1; }
          SDK_DIR="${SDK_MK%/toolchain/prospero.mk}"
          echo "PS5_PAYLOAD_SDK=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Prepare read-only PTP handshake probe
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/extracted/iPhone2PS5"
          mkdir -p "$ROOT/bin"

          cat > "$ROOT/src/payload.c" <<'C'
          #include <sys/types.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <poll.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          #include <unistd.h>

          typedef struct notify_request {
              char useless1[45];
              char message[3075];
          } notify_request_t;
          int sceKernelSendNotificationRequest(int, notify_request_t *, size_t, int);

          static void notify(const char *message) {
              notify_request_t request;
              memset(&request, 0, sizeof(request));
              snprintf(request.message, sizeof(request.message), "%s", message);
              sceKernelSendNotificationRequest(0, &request, sizeof(request), 0);
          }

          static uint32_t le32(const unsigned char *p) {
              return (uint32_t)p[0] | ((uint32_t)p[1] << 8) |
                     ((uint32_t)p[2] << 16) | ((uint32_t)p[3] << 24);
          }
          static uint16_t le16(const unsigned char *p) {
              return (uint16_t)p[0] | ((uint16_t)p[1] << 8);
          }
          static int wait_readable(int fd, int ms) {
              struct pollfd pfd;
              pfd.fd = fd;
              pfd.events = POLLIN;
              pfd.revents = 0;
              return poll(&pfd, 1, ms);
          }

          int main(void) {
              const char *out_path = "/dev/usb/1.2.2";
              const char *in_path  = "/dev/usb/1.2.1";
              int eo = 0, ei = 0;
              errno = 0;
              int outfd = open(out_path, O_WRONLY);
              if (outfd < 0) eo = errno;
              errno = 0;
              int infd = open(in_path, O_RDONLY);
              if (infd < 0) ei = errno;

              char msg[3075];
              if (outfd < 0 || infd < 0) {
                  snprintf(msg, sizeof(msg),
                           "iPhone2PS5 PTP: open failed OUT=%d e=%d IN=%d e=%d",
                           outfd, eo, infd, ei);
                  notify(msg);
                  if (outfd >= 0) close(outfd);
                  if (infd >= 0) close(infd);
                  return 0;
              }

              /* PTP GetDeviceInfo (0x1001): read-only device information request. */
              const unsigned char command[12] = {
                  0x10,0x00,0x00,0x00,
                  0x01,0x00,
                  0x01,0x10,
                  0x00,0x00,0x00,0x00
              };

              errno = 0;
              ssize_t sent = write(outfd, command, sizeof(command));
              int write_errno = (sent < 0) ? errno : 0;
              if (sent != (ssize_t)sizeof(command)) {
                  snprintf(msg, sizeof(msg),
                           "iPhone2PS5 PTP: 12-byte command write=%ld errno=%d",
                           (long)sent, write_errno);
                  notify(msg);
                  close(outfd); close(infd);
                  return 0;
              }

              unsigned char data[4096] = {0};
              int ready = wait_readable(infd, 5000);
              if (ready <= 0) {
                  snprintf(msg, sizeof(msg),
                           "iPhone2PS5 PTP: sent=12; bulk IN no data poll=%d errno=%d",
                           ready, errno);
                  notify(msg);
                  close(outfd); close(infd);
                  return 0;
              }

              errno = 0;
              ssize_t got = read(infd, data, sizeof(data));
              int read_errno = (got < 0) ? errno : 0;
              if (got < 12) {
                  snprintf(msg, sizeof(msg),
                           "iPhone2PS5 PTP: sent=12; read=%ld errno=%d",
                           (long)got, read_errno);
                  notify(msg);
                  close(outfd); close(infd);
                  return 0;
              }

              uint32_t declared = le32(data);
              uint16_t type = le16(data + 4);
              uint16_t code = le16(data + 6);
              uint32_t txid = le32(data + 8);

              size_t consumed = (size_t)got;
              while (declared >= 12 && consumed < declared && consumed < sizeof(data)) {
                  if (wait_readable(infd, 1500) <= 0) break;
                  ssize_t n = read(infd, data + consumed, sizeof(data) - consumed);
                  if (n <= 0) break;
                  consumed += (size_t)n;
              }

              int response_ready = wait_readable(infd, 3000);
              unsigned char response[64] = {0};
              ssize_t response_len = -1;
              if (response_ready > 0)
                  response_len = read(infd, response, sizeof(response));

              snprintf(msg, sizeof(msg),
                       "iPhone2PS5 PTP: sent=12 data=%ld declared=%u type=0x%04x code=0x%04x tx=%u drained=%lu resp=%ld",
                       (long)got, declared, type, code, txid,
                       (unsigned long)consumed, (long)response_len);
              if (response_len >= 12) {
                  snprintf(msg + strlen(msg), sizeof(msg) - strlen(msg),
                           " resp-len=%u resp-type=0x%04x resp-code=0x%04x resp-tx=%u",
                           le32(response), le16(response + 4),
                           le16(response + 6), le32(response + 8));
              }
              close(outfd);
              close(infd);
              notify(msg);
              return 0;
          }
          C

          cat > "$ROOT/Makefile" <<'MAKE'
          PS5_HOST ?= ps5
          PS5_PORT ?= 9021
          ifndef PS5_PAYLOAD_SDK
          $(error PS5_PAYLOAD_SDK is undefined)
          endif
          include $(PS5_PAYLOAD_SDK)/toolchain/prospero.mk
          ELF := bin/iPhone2PS5.elf
          CFLAGS := -Wall -O2
          all: $(ELF)
          $(ELF): src/payload.c
          	$(CC) $(CFLAGS) -o $@ $^
          clean:
          	rm -f $(ELF)
          .PHONY: all clean
          MAKE

      - name: Build ELF
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/extracted/iPhone2PS5"
          make -C "$ROOT" PS5_PAYLOAD_SDK="$PS5_PAYLOAD_SDK"
          ELF="$ROOT/bin/iPhone2PS5.elf"
          test -s "$ELF"
          file "$ELF"
          readelf -h "$ELF"

      - name: Upload PTP handshake probe ELF
        uses: actions/upload-artifact@v4
        with:
          name: iPhone2PS5-PTP-handshake-probe-ELF
          path: extracted/iPhone2PS5/bin/iPhone2PS5.elf
          if-no-files-found: error
          retention-days: 14
